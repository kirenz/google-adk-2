project:
  type: book
  output-dir: _book
  resources:
    - images/**
    - examples/**/*.py
    - examples/README.md
    - evaluations/*.json
    - .env.example
    - pyproject.toml
    - uv.lock
    - README.md
    - "!**/.venv/**"
    - "!**/.pytest_cache/**"
    - "!**/__pycache__/**"
    - "!**/.adk/**"
    - "!**/artifacts/**"
  preview:
    port: 4202
    browser: false

lang: en
execute:
  enabled: false

book:
  title: "Google ADK 2"
  subtitle: "Build, inspect, and evaluate agent workflows"
  author: "Jan Kirenz"
  repo-url: https://github.com/kirenz/google-adk-2
  repo-actions: [source, issue]
  search:
    type: overlay
  sidebar:
    style: floating
    collapse-level: 2
  page-footer:
    left: "© Jan Kirenz, 2026"
    right: "Python · ADK 2 · uv · Gradio"
  chapters:
    - index.qmd
    - part: "Preparation"
      chapters:
        - chapters/02-workstation.qmd
        - chapters/accounts.qmd
        - chapters/windows-setup.qmd
        - chapters/mac-setup.qmd
        - chapters/mssql-vscode.qmd
        - chapters/03-project-setup.qmd
        - chapters/mssql-connection.qmd
    - part: "Build and understand agents"
      chapters:
        - chapters/01-agent-fundamentals.qmd
        - chapters/04-first-agent.qmd
        - chapters/05-tools-context.qmd
        - chapters/06-runtime-sessions.qmd
    - part: "Connect the system"
      chapters:
        - chapters/07-workflow-graphs.qmd
        - chapters/08-multi-agent.qmd
        - chapters/09-gradio.qmd
        - chapters/10-bi-project.qmd
    - part: "Check and extend"
      chapters:
        - chapters/11-evaluation.qmd
        - chapters/12-advanced.qmd
    - references.qmd

number-sections: true
format:
  html:
    theme: [cosmo, theme.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    callout-appearance: simple
    link-external-newwindow: true
    fig-align: center
